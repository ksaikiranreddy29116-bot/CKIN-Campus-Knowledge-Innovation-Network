{% extends 'base.html' %}

{% block title %}Submit Project — CKIN{% endblock %}

{% block content %}
<div class="row justify-content-center my-4">
    <div class="col-md-9 col-lg-8">
        <div class="card card-custom p-4">
            <h3 class="fw-bold mb-1 text-cyan"><i class="fa-solid fa-plus-circle me-2"></i> Submit New Project Proposal</h3>
            <p class="text-secondary mb-4">Submit your project proposal for NLP similarity checking and faculty approval.</p>

            <form method="POST" action="{{ url_for('create_project_page') }}">
                <div class="row g-3">
                    <div class="col-12">
                        <label class="form-label text-secondary">Project Title *</label>
                        <input type="text" name="title" class="form-control" required placeholder="e.g. AI-Powered Smart Campus Waste Management">
                    </div>
                    <div class="col-12">
                        <label class="form-label text-secondary">Project Description *</label>
                        <textarea name="description" class="form-control" rows="4" required placeholder="Describe the objectives, architecture, technical methodology, and target outcomes of your project in detail..."></textarea>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-secondary">Domain / Field *</label>
                        <select name="domain" class="form-select" required>
                            <option value="Artificial Intelligence">Artificial Intelligence</option>
                            <option value="Data Science">Data Science</option>
                            <option value="Web Application">Web Application</option>
                            <option value="Mobile Application">Mobile Application</option>
                            <option value="IoT & Analytics">IoT & Analytics</option>
                            <option value="Cybersecurity">Cybersecurity</option>
                            <option value="Software Engineering">Software Engineering</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-secondary">Project Type</label>
                        <select name="project_type" class="form-select">
                            <option value="Web Application">Web Application</option>
                            <option value="Mobile Application">Mobile Application</option>
                            <option value="Data Science">Data Science</option>
                            <option value="IoT & Analytics">IoT & Analytics</option>
                            <option value="Research Paper">Research Paper</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="form-label text-secondary">Required Skills * (comma-separated)</label>
                        <input type="text" name="required_skills" class="form-control" required placeholder="e.g. Python, Flask, PyTorch, React, SQLite">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label text-secondary">Difficulty Level</label>
                        <select name="difficulty_level" class="form-select">
                            <option value="Easy">Easy</option>
                            <option value="Medium" selected>Medium</option>
                            <option value="Hard">Hard</option>
                            <option value="Advanced">Advanced</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label text-secondary">Weekly Commitment (Hours)</label>
                        <input type="number" name="weekly_commitment" class="form-control" value="10" min="1" max="40">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label text-secondary">Team Size (Members)</label>
                        <input type="number" name="team_size" class="form-control" value="4" min="1" max="10">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-secondary">Expected Duration</label>
                        <select name="expected_duration" class="form-select">
                            <option value="1 Month">1 Month</option>
                            <option value="2 Months">2 Months</option>
                            <option value="3 Months" selected>3 Months</option>
                            <option value="6 Months">6 Months</option>
                        </select>
                    </div>
                </div>

                <div class="mt-4 pt-2">
                    <button type="submit" class="btn btn-primary-custom w-100 py-2 fs-6 fw-bold">
                        <i class="fa-solid fa-paper-plane me-1"></i> Submit Proposal for Review
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
